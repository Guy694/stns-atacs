name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        run: npx eslint app lib

      - name: Unit tests
        run: npm test

      # การทดสอบแบบ integration ต้องมี MySQL/MariaDB จริง จึงแยกเป็น job ด้านล่าง

  integration:
    name: integration tests (MariaDB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    services:
      db:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ci-root
          MARIADB_DATABASE: atacs_test
          MARIADB_USER: atacs
          MARIADB_PASSWORD: ci-pass
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      ATACS_TEST_MYSQL_PORT: "3306"
      ATACS_TEST_MYSQL_USER: root
      ATACS_TEST_MYSQL_PASSWORD: ci-root

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Integration tests
        run: npm run test:integration
