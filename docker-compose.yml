# ATACS on a Linux server with Docker.
#   1) cp docker/env.example .env.docker   and fill in the values
#   2) docker compose --env-file .env.docker up -d --build
# Other variables the app reads (TELEGRAM_*, SECURITY_*, ...) can be added under app.environment.
# See docs/deploy-docker.md for importing the database, HTTPS, backups and updates.

name: atacs

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE:-stn_atacs}
      MARIADB_USER: ${MYSQL_USER:-atacs}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env.docker}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env.docker}
      TZ: Asia/Bangkok
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+07:00
      - --max-allowed-packet=64M
    volumes:
      - db_data:/var/lib/mysql
      # Put a dump here (e.g. 01-stn_atacs.sql) before the FIRST start to load it automatically.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    # Only reachable from the server itself (for phpMyAdmin/DBeaver over SSH); remove to keep it fully private.
    ports:
      - "127.0.0.1:${DB_PUBLISH_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${APP_URL:-}
    image: atacs-app:latest
    restart: unless-stopped
    # Only what the app needs (the database root password stays out of this container).
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      TZ: Asia/Bangkok
      MYSQL_DATABASE: ${MYSQL_DATABASE:-}
      MYSQL_USER: ${MYSQL_USER:-}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      THAID_CID_HASH_KEY: ${THAID_CID_HASH_KEY:-}
      AUTH_SESSION_DAYS: ${AUTH_SESSION_DAYS:-}
      AUTH_IDLE_TIMEOUT_MINUTES: ${AUTH_IDLE_TIMEOUT_MINUTES:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-}
      THAID_ENABLED: ${THAID_ENABLED:-}
      CLIENT_ID: ${CLIENT_ID:-}
      CLIENT_SECRET: ${CLIENT_SECRET:-}
      APIKEY: ${APIKEY:-}
      CALLBACK: ${CALLBACK:-}
      GOOGLE_AUTH_ENABLED: ${GOOGLE_AUTH_ENABLED:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      TELEGRAM_ALERTS_ENABLED: ${TELEGRAM_ALERTS_ENABLED:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ATACS_AGENT_INSTALL_KEY: ${ATACS_AGENT_INSTALL_KEY:-}
      AGENT_OFFLINE_MINUTES: ${AGENT_OFFLINE_MINUTES:-}
      CRON_SECRET: ${CRON_SECRET:-}
      # Only set on a deployment that should send agents elsewhere (e.g. on the OLD Vercel project).
      AGENT_API_BASE_URL: ${AGENT_API_BASE_URL:-}
      AGENT_API_BASE_ALLOWED_HOSTS: ${AGENT_API_BASE_ALLOWED_HOSTS:-}
      # Asset photos: outside public/, served only to signed-in users by the app.
      UPLOAD_DIR: /app/storage/uploads
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/storage/uploads
    expose:
      - "3000"

  # Reverse proxy: handles HTTPS (automatic Let's Encrypt when
  # SITE_ADDRESS is a public domain; use ":80" for plain HTTP on an internal network).
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # Replaces Vercel Cron:
  #   - agent health check every CRON_INTERVAL_SECONDS
  #   - daily Telegram summary (overdue loans, inspection deadlines, warranty/MA, pending disposals,
  #     long-open repairs) once a day at DAILY_SUMMARY_TIME (HH:MM, Asia/Bangkok)
  cron:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
      CRON_INTERVAL_SECONDS: ${CRON_INTERVAL_SECONDS:-3600}
      DAILY_SUMMARY_TIME: ${DAILY_SUMMARY_TIME:-08:00}
      TZ: Asia/Bangkok
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$CRON_SECRET" ]; then echo "CRON_SECRET not set: scheduled jobs disabled"; while true; do sleep 3600; done; fi
        call() { curl -fsS -m 120 -H "Authorization: Bearer $$CRON_SECRET" "http://app:3000$$1" -o /dev/null && echo "$$(date) $$1 ok" || echo "$$(date) $$1 failed"; }
        sleep 60
        last_health=0
        last_summary_day=""
        while true; do
          now=$$(date +%s)
          if [ $$((now - last_health)) -ge "$$CRON_INTERVAL_SECONDS" ]; then call /api/cron/agent-health; last_health=$$now; fi
          today=$$(date +%Y-%m-%d)
          if [ "$$(date +%H:%M)" \> "$$DAILY_SUMMARY_TIME" ] || [ "$$(date +%H:%M)" = "$$DAILY_SUMMARY_TIME" ]; then
            if [ "$$today" != "$$last_summary_day" ]; then call /api/cron/daily-summary; last_summary_day=$$today; fi
          fi
          sleep 60
        done
    depends_on:
      - app

  # Nightly backup of the database and uploaded photos into ./backups on the host
  # (keeps BACKUP_KEEP_DAYS days). Manual run: docker compose exec backup bash /backup.sh now
  backup:
    image: mariadb:10.11
    restart: unless-stopped
    entrypoint: ["bash", "/backup.sh"]
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE:-stn_atacs}
      MYSQL_USER: ${MYSQL_USER:-atacs}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_ON_START: ${BACKUP_ON_START:-0}
      TZ: Asia/Bangkok
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      - uploads:/uploads:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  uploads:
  caddy_data:
  caddy_config:
