<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">การดูภาพรวม Windows จากจังหวัดสู่อำเภอและหน่วยงาน</title>
  <desc id="desc">ลำดับการใช้ Dashboard สำหรับผู้ดูแลระบบจากยอดรวมจังหวัด สรุปรายอำเภอ ไปยังรายละเอียดรายหน่วยงาน</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#15803d"/></marker></defs>
  <rect width="1600" height="900" fill="#f5faf7"/>
  <text x="100" y="105" fill="#113127" font-family="system-ui,sans-serif" font-size="46" font-weight="700">ดูข้อมูลจากภาพรวมไปสู่รายหน่วยงาน</text>
  <text x="100" y="150" fill="#4f6b60" font-family="system-ui,sans-serif" font-size="22">สำหรับ Admin · ใช้ตัวกรองและมุมมองใน Dashboard เดียวกัน</text>
  <g font-family="system-ui,sans-serif">
    <g transform="translate(95 255)"><rect width="390" height="370" rx="18" fill="#fff" stroke="#bbf7d0" stroke-width="3"/><text x="195" y="65" text-anchor="middle" fill="#14532d" font-size="28" font-weight="700">1. ภาพรวมจังหวัด</text><g fill="#f4f7f5"><rect x="35" y="105" width="145" height="95" rx="12"/><rect x="210" y="105" width="145" height="95" rx="12"/><rect x="35" y="225" width="145" height="95" rx="12"/><rect x="210" y="225" width="145" height="95" rx="12"/></g><g font-size="17" fill="#4f6b60"><text x="53" y="140">คอมพิวเตอร์</text><text x="228" y="140">Windows แท้</text><text x="53" y="260">Windows ไม่แท้</text><text x="228" y="260">ยังไม่ระบุ</text></g><g font-size="30" font-weight="700" fill="#113127"><text x="53" y="180">ทั้งหมด</text><text x="228" y="180">จำนวน</text><text x="53" y="300">จำนวน</text><text x="228" y="300">จำนวน</text></g></g>
    <path d="M485 440h115" stroke="#15803d" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(610 255)"><rect width="390" height="370" rx="18" fill="#fff" stroke="#bbf7d0" stroke-width="3"/><text x="195" y="65" text-anchor="middle" fill="#14532d" font-size="28" font-weight="700">2. รายอำเภอ</text><g font-size="19" fill="#113127"><text x="45" y="135">อำเภอเมืองสตูล</text><text x="45" y="195">อำเภอละงู</text><text x="45" y="255">อำเภอควนกาหลง</text><text x="45" y="315">อำเภอทุ่งหว้า</text></g><g font-size="18" fill="#15803d" text-anchor="end"><text x="345" y="135">ดูหน่วยงาน →</text><text x="345" y="195">ดูหน่วยงาน →</text><text x="345" y="255">ดูหน่วยงาน →</text><text x="345" y="315">ดูหน่วยงาน →</text></g></g>
    <path d="M1000 440h115" stroke="#15803d" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(1125 255)"><rect width="390" height="370" rx="18" fill="#fff" stroke="#bbf7d0" stroke-width="3"/><text x="195" y="65" text-anchor="middle" fill="#14532d" font-size="28" font-weight="700">3. รายหน่วยงาน</text><text x="45" y="125" fill="#4f6b60" font-size="17">หน่วยงาน</text><text x="345" y="125" text-anchor="end" fill="#4f6b60" font-size="17">คอมพิวเตอร์ / แท้ / ไม่แท้</text><g font-size="18" fill="#113127"><text x="45" y="180">สสจ.สตูล</text><text x="45" y="235">โรงพยาบาลตัวอย่าง</text><text x="45" y="290">รพ.สต.ตัวอย่าง</text></g><g font-size="18" fill="#166534" text-anchor="end"><text x="345" y="180">12 / 10 / 1</text><text x="345" y="235">8 / 7 / 0</text><text x="345" y="290">3 / 2 / 1</text></g></g>
  </g>
  <rect x="340" y="700" width="920" height="95" rx="16" fill="#e0f2fe" stroke="#bae6fd" stroke-width="2"/>
  <text x="800" y="740" text-anchor="middle" fill="#075985" font-family="system-ui,sans-serif" font-size="21" font-weight="700">“ยังไม่ระบุ” ไม่เท่ากับ “Windows ไม่แท้”</text>
  <text x="800" y="775" text-anchor="middle" fill="#075985" font-family="system-ui,sans-serif" font-size="19">ให้เปิดรายการคอมพิวเตอร์และแก้ไขข้อมูลให้ครบถ้วน</text>
</svg>
