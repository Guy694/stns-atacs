<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">นำเข้า CSV / Excel อย่างถูกต้อง</title>
  <desc id="desc">1. ดาวน์โหลดไฟล์ตัวอย่าง — คงชื่อคอลัมน์ และกรอก asset_name — บันทึก CSV เป็น UTF-8; 2. ตรวจ id และกลุ่มงาน — เพิ่มใหม่: เว้น id ว่าง — แก้ไข: ใช้ id จาก Export ของระบบ; 3. เลือกหน่วยบริการ — ใช้ work_group_id ของหน่วยบริการนี้ — เลือกไฟล์แล้วเริ่มนำเข้า; 4. อ่านผลเป็น record — เพิ่มใหม่ + แก้ไข = สำเร็จ — ข้าม / ไม่สำเร็จ: ตรวจแถวและเหตุผล</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#15803d" stroke-width="2"/></marker></defs>
  <rect width="1600" height="900" fill="#f5faf7"/>
  <g font-family="Tahoma,system-ui,sans-serif">
    <text x="80" y="68" fill="#4f6b60" font-size="22">ATACS · ภาพอธิบายขั้นตอน</text>
    <text x="80" y="135" fill="#113127" font-size="44" font-weight="700">นำเข้า CSV / Excel อย่างถูกต้อง</text>
    <text x="80" y="187" fill="#4f6b60" font-size="27">เตรียมไฟล์ → เลือกหน่วยบริการ → อัปโหลด → ตรวจผล</text>
    <g transform="translate(80 245)">
      <rect width="670" height="205" rx="14" fill="#ffffff" stroke="#b8d3c3"/>
      <circle cx="52" cy="53" r="25" fill="#dcfce7"/>
      <text x="52" y="62" text-anchor="middle" fill="#14532d" font-size="26" font-weight="700">1</text>
      <text x="95" y="64" fill="#113127" font-size="32" font-weight="600">ดาวน์โหลดไฟล์ตัวอย่าง</text>
      <text x="36" y="121" fill="#344a40" font-size="27">คงชื่อคอลัมน์ และกรอก asset_name</text>
      <text x="36" y="165" fill="#344a40" font-size="27">บันทึก CSV เป็น UTF-8</text>
    </g>
<g transform="translate(850 245)">
      <rect width="670" height="205" rx="14" fill="#ffffff" stroke="#b8d3c3"/>
      <circle cx="52" cy="53" r="25" fill="#dcfce7"/>
      <text x="52" y="62" text-anchor="middle" fill="#14532d" font-size="26" font-weight="700">2</text>
      <text x="95" y="64" fill="#113127" font-size="32" font-weight="600">ตรวจ id และกลุ่มงาน</text>
      <text x="36" y="121" fill="#344a40" font-size="27">เพิ่มใหม่: เว้น id ว่าง</text>
      <text x="36" y="165" fill="#344a40" font-size="27">แก้ไข: ใช้ id จาก Export ของระบบ</text>
    </g>
<g transform="translate(80 520)">
      <rect width="670" height="205" rx="14" fill="#ffffff" stroke="#b8d3c3"/>
      <circle cx="52" cy="53" r="25" fill="#dcfce7"/>
      <text x="52" y="62" text-anchor="middle" fill="#14532d" font-size="26" font-weight="700">3</text>
      <text x="95" y="64" fill="#113127" font-size="32" font-weight="600">เลือกหน่วยบริการ</text>
      <text x="36" y="121" fill="#344a40" font-size="27">ใช้ work_group_id ของหน่วยบริการนี้</text>
      <text x="36" y="165" fill="#344a40" font-size="27">เลือกไฟล์แล้วเริ่มนำเข้า</text>
    </g>
<g transform="translate(850 520)">
      <rect width="670" height="205" rx="14" fill="#ffffff" stroke="#b8d3c3"/>
      <circle cx="52" cy="53" r="25" fill="#dcfce7"/>
      <text x="52" y="62" text-anchor="middle" fill="#14532d" font-size="26" font-weight="700">4</text>
      <text x="95" y="64" fill="#113127" font-size="32" font-weight="600">อ่านผลเป็น record</text>
      <text x="36" y="121" fill="#344a40" font-size="27">เพิ่มใหม่ + แก้ไข = สำเร็จ</text>
      <text x="36" y="165" fill="#344a40" font-size="27">ข้าม / ไม่สำเร็จ: ตรวจแถวและเหตุผล</text>
    </g>
    <path d="M765 347H830" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1185 462V482H415V505" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M765 622H830" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M80 784H1520" stroke="#b8d3c3"/>
    <text x="80" y="836" fill="#14532d" font-size="26">นำเข้าใหม่เฉพาะแถวที่ไม่สำเร็จ เพื่อไม่ให้รายการที่เพิ่มสำเร็จแล้วซ้ำ</text>
  </g>
</svg>
