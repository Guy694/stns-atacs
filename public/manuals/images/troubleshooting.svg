<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ตรวจปัญหาทีละจุด</title>
  <desc id="desc">1. อ่านสิ่งที่ระบบแจ้ง — จดข้อความผิดพลาดและชื่อหน้า — ตรวจว่าบันทึกสำเร็จแล้วหรือยัง; 2. ตรวจบัญชี — รออนุมัติ? หมดเวลาใช้งาน? — ตรวจบทบาท สิทธิ์ และหน่วยงาน; 3. ตรวจข้อมูล — ล้างตัวกรอง / กรอกช่องบังคับ — CSV: ตรวจ id และ work_group_id; 4. ติดต่อผู้ดูแล — แจ้งเวลา ขั้นตอน และข้อความผิดพลาด — แนบภาพโดยปกปิดข้อมูลลับ</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#15803d" stroke-width="2"/></marker></defs>
  <rect width="1600" height="900" fill="#f5faf7"/>
  <g font-family="Tahoma,system-ui,sans-serif">
    <text x="80" y="68" fill="#4f6b60" font-size="22">ATACS · ภาพอธิบายขั้นตอน</text>
    <text x="80" y="135" fill="#113127" font-size="44" font-weight="700">ตรวจปัญหาทีละจุด</text>
    <text x="80" y="187" fill="#4f6b60" font-size="27">เก็บข้อความผิดพลาดไว้ เพื่อให้แก้ไขได้ตรงจุด</text>
    <g transform="translate(80 245)">
      <rect width="670" height="205" rx="14" fill="#ffffff" stroke="#b8d3c3"/>
      <circle cx="52" cy="53" r="25" fill="#dcfce7"/>
      <text x="52" y="62" text-anchor="middle" fill="#14532d" font-size="26" font-weight="700">1</text>
      <text x="95" y="64" fill="#113127" font-size="32" font-weight="600">อ่านสิ่งที่ระบบแจ้ง</text>
      <text x="36" y="121" fill="#344a40" font-size="27">จดข้อความผิดพลาดและชื่อหน้า</text>
      <text x="36" y="165" fill="#344a40" font-size="27">ตรวจว่าบันทึกสำเร็จแล้วหรือยัง</text>
    </g>
<g transform="translate(850 245)">
      <rect width="670" height="205" rx="14" fill="#ffffff" stroke="#b8d3c3"/>
      <circle cx="52" cy="53" r="25" fill="#dcfce7"/>
      <text x="52" y="62" text-anchor="middle" fill="#14532d" font-size="26" font-weight="700">2</text>
      <text x="95" y="64" fill="#113127" font-size="32" font-weight="600">ตรวจบัญชี</text>
      <text x="36" y="121" fill="#344a40" font-size="27">รออนุมัติ? หมดเวลาใช้งาน?</text>
      <text x="36" y="165" fill="#344a40" font-size="27">ตรวจบทบาท สิทธิ์ และหน่วยงาน</text>
    </g>
<g transform="translate(80 520)">
      <rect width="670" height="205" rx="14" fill="#ffffff" stroke="#b8d3c3"/>
      <circle cx="52" cy="53" r="25" fill="#dcfce7"/>
      <text x="52" y="62" text-anchor="middle" fill="#14532d" font-size="26" font-weight="700">3</text>
      <text x="95" y="64" fill="#113127" font-size="32" font-weight="600">ตรวจข้อมูล</text>
      <text x="36" y="121" fill="#344a40" font-size="27">ล้างตัวกรอง / กรอกช่องบังคับ</text>
      <text x="36" y="165" fill="#344a40" font-size="27">CSV: ตรวจ id และ work_group_id</text>
    </g>
<g transform="translate(850 520)">
      <rect width="670" height="205" rx="14" fill="#ffffff" stroke="#b8d3c3"/>
      <circle cx="52" cy="53" r="25" fill="#dcfce7"/>
      <text x="52" y="62" text-anchor="middle" fill="#14532d" font-size="26" font-weight="700">4</text>
      <text x="95" y="64" fill="#113127" font-size="32" font-weight="600">ติดต่อผู้ดูแล</text>
      <text x="36" y="121" fill="#344a40" font-size="27">แจ้งเวลา ขั้นตอน และข้อความผิดพลาด</text>
      <text x="36" y="165" fill="#344a40" font-size="27">แนบภาพโดยปกปิดข้อมูลลับ</text>
    </g>
    <path d="M765 347H830" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1185 462V482H415V505" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M765 622H830" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M80 784H1520" stroke="#b8d3c3"/>
    <text x="80" y="836" fill="#14532d" font-size="26">อย่าเพิ่มหรือนำเข้าซ้ำก่อนตรวจว่ารายการเดิมบันทึกสำเร็จหรือไม่</text>
  </g>
</svg>
