<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">เตรียมเครื่องให้พร้อมสำหรับ ATACS Agent</title>
  <desc id="desc">1. ตรวจบัญชี — บัญชีต้องผูกหน่วยงานถูกต้อง — เลือกกลุ่มงานตามที่ระบบกำหนด; 2. ดาวน์โหลด — ใช้ตัวติดตั้งจากหน้าของระบบ — อ่านคำแนะนำก่อนเรียกใช้; 3. ติดตั้งบนเครื่อง — Windows: สิทธิ์ Administrator — Linux: สิทธิ์ sudo / root; 4. ตรวจการติดต่อ — ดูข้อมูลเครื่องและเวลาติดต่อล่าสุด — หากไม่พบ ให้ตรวจเครือข่ายและ Agent</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#15803d" stroke-width="2"/></marker></defs>
  <rect width="1600" height="900" fill="#f5faf7"/>
  <g font-family="Tahoma,system-ui,sans-serif">
    <text x="80" y="68" fill="#4f6b60" font-size="22">ATACS · ภาพอธิบายขั้นตอน</text>
    <text x="80" y="135" fill="#113127" font-size="44" font-weight="700">เตรียมเครื่องให้พร้อมสำหรับ ATACS Agent</text>
    <text x="80" y="187" fill="#4f6b60" font-size="27">เจ้าหน้าที่หน่วยงาน → ดาวน์โหลด Agent</text>
    <g transform="translate(80 245)">
      <rect width="670" height="205" rx="14" fill="#ffffff" stroke="#b8d3c3"/>
      <circle cx="52" cy="53" r="25" fill="#dcfce7"/>
      <text x="52" y="62" text-anchor="middle" fill="#14532d" font-size="26" font-weight="700">1</text>
      <text x="95" y="64" fill="#113127" font-size="32" font-weight="600">ตรวจบัญชี</text>
      <text x="36" y="121" fill="#344a40" font-size="27">บัญชีต้องผูกหน่วยงานถูกต้อง</text>
      <text x="36" y="165" fill="#344a40" font-size="27">เลือกกลุ่มงานตามที่ระบบกำหนด</text>
    </g>
<g transform="translate(850 245)">
      <rect width="670" height="205" rx="14" fill="#ffffff" stroke="#b8d3c3"/>
      <circle cx="52" cy="53" r="25" fill="#dcfce7"/>
      <text x="52" y="62" text-anchor="middle" fill="#14532d" font-size="26" font-weight="700">2</text>
      <text x="95" y="64" fill="#113127" font-size="32" font-weight="600">ดาวน์โหลด</text>
      <text x="36" y="121" fill="#344a40" font-size="27">ใช้ตัวติดตั้งจากหน้าของระบบ</text>
      <text x="36" y="165" fill="#344a40" font-size="27">อ่านคำแนะนำก่อนเรียกใช้</text>
    </g>
<g transform="translate(80 520)">
      <rect width="670" height="205" rx="14" fill="#ffffff" stroke="#b8d3c3"/>
      <circle cx="52" cy="53" r="25" fill="#dcfce7"/>
      <text x="52" y="62" text-anchor="middle" fill="#14532d" font-size="26" font-weight="700">3</text>
      <text x="95" y="64" fill="#113127" font-size="32" font-weight="600">ติดตั้งบนเครื่อง</text>
      <text x="36" y="121" fill="#344a40" font-size="27">Windows: สิทธิ์ Administrator</text>
      <text x="36" y="165" fill="#344a40" font-size="27">Linux: สิทธิ์ sudo / root</text>
    </g>
<g transform="translate(850 520)">
      <rect width="670" height="205" rx="14" fill="#ffffff" stroke="#b8d3c3"/>
      <circle cx="52" cy="53" r="25" fill="#dcfce7"/>
      <text x="52" y="62" text-anchor="middle" fill="#14532d" font-size="26" font-weight="700">4</text>
      <text x="95" y="64" fill="#113127" font-size="32" font-weight="600">ตรวจการติดต่อ</text>
      <text x="36" y="121" fill="#344a40" font-size="27">ดูข้อมูลเครื่องและเวลาติดต่อล่าสุด</text>
      <text x="36" y="165" fill="#344a40" font-size="27">หากไม่พบ ให้ตรวจเครือข่ายและ Agent</text>
    </g>
    <path d="M765 347H830" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1185 462V482H415V505" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M765 622H830" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M80 784H1520" stroke="#b8d3c3"/>
    <text x="80" y="836" fill="#14532d" font-size="26">Enrollment Token และ Install Key เป็นข้อมูลลับ ไม่ใส่ในภาพหน้าจอที่เผยแพร่</text>
  </g>
</svg>
