<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">อ่านข้อมูลและนำรายงานไปใช้</title>
  <desc id="desc">1. ดูแผนที่ — เปิดแผนที่ทรัพย์สิน — เลือกหมุดหรือรายการหน่วยบริการ; 2. เลือกมุมมองรายงาน — ภาพรวม · หน่วยงาน · ประเภท — ใกล้หมดอายุ MA · ชำรุด / ไม่ใช้งาน; 3. ตรวจขอบเขตข้อมูล — ดูตัวกรองและหน่วยงาน — ตรวจยอดก่อนส่งออก; 4. ส่งออก CSV — ใช้ปุ่ม Export CSV ที่แสดง — เปิดไฟล์ด้วย UTF-8 เพื่ออ่านภาษาไทย</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#15803d" stroke-width="2"/></marker></defs>
  <rect width="1600" height="900" fill="#f5faf7"/>
  <g font-family="Tahoma,system-ui,sans-serif">
    <text x="80" y="68" fill="#4f6b60" font-size="22">ATACS · ภาพอธิบายขั้นตอน</text>
    <text x="80" y="135" fill="#113127" font-size="44" font-weight="700">อ่านข้อมูลและนำรายงานไปใช้</text>
    <text x="80" y="187" fill="#4f6b60" font-size="27">แผนที่แสดงตำแหน่ง · รายงานแสดงยอดและรายการ</text>
    <g transform="translate(80 245)">
      <rect width="670" height="205" rx="14" fill="#ffffff" stroke="#b8d3c3"/>
      <circle cx="52" cy="53" r="25" fill="#dcfce7"/>
      <text x="52" y="62" text-anchor="middle" fill="#14532d" font-size="26" font-weight="700">1</text>
      <text x="95" y="64" fill="#113127" font-size="32" font-weight="600">ดูแผนที่</text>
      <text x="36" y="121" fill="#344a40" font-size="27">เปิดแผนที่ทรัพย์สิน</text>
      <text x="36" y="165" fill="#344a40" font-size="27">เลือกหมุดหรือรายการหน่วยบริการ</text>
    </g>
<g transform="translate(850 245)">
      <rect width="670" height="205" rx="14" fill="#ffffff" stroke="#b8d3c3"/>
      <circle cx="52" cy="53" r="25" fill="#dcfce7"/>
      <text x="52" y="62" text-anchor="middle" fill="#14532d" font-size="26" font-weight="700">2</text>
      <text x="95" y="64" fill="#113127" font-size="32" font-weight="600">เลือกมุมมองรายงาน</text>
      <text x="36" y="121" fill="#344a40" font-size="27">ภาพรวม · หน่วยงาน · ประเภท</text>
      <text x="36" y="165" fill="#344a40" font-size="27">ใกล้หมดอายุ MA · ชำรุด / ไม่ใช้งาน</text>
    </g>
<g transform="translate(80 520)">
      <rect width="670" height="205" rx="14" fill="#ffffff" stroke="#b8d3c3"/>
      <circle cx="52" cy="53" r="25" fill="#dcfce7"/>
      <text x="52" y="62" text-anchor="middle" fill="#14532d" font-size="26" font-weight="700">3</text>
      <text x="95" y="64" fill="#113127" font-size="32" font-weight="600">ตรวจขอบเขตข้อมูล</text>
      <text x="36" y="121" fill="#344a40" font-size="27">ดูตัวกรองและหน่วยงาน</text>
      <text x="36" y="165" fill="#344a40" font-size="27">ตรวจยอดก่อนส่งออก</text>
    </g>
<g transform="translate(850 520)">
      <rect width="670" height="205" rx="14" fill="#ffffff" stroke="#b8d3c3"/>
      <circle cx="52" cy="53" r="25" fill="#dcfce7"/>
      <text x="52" y="62" text-anchor="middle" fill="#14532d" font-size="26" font-weight="700">4</text>
      <text x="95" y="64" fill="#113127" font-size="32" font-weight="600">ส่งออก CSV</text>
      <text x="36" y="121" fill="#344a40" font-size="27">ใช้ปุ่ม Export CSV ที่แสดง</text>
      <text x="36" y="165" fill="#344a40" font-size="27">เปิดไฟล์ด้วย UTF-8 เพื่ออ่านภาษาไทย</text>
    </g>
    <path d="M765 347H830" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1185 462V482H415V505" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M765 622H830" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M80 784H1520" stroke="#b8d3c3"/>
    <text x="80" y="836" fill="#14532d" font-size="26">ข้อมูลที่เห็นขึ้นอยู่กับสิทธิ์ของบัญชีและขอบเขตที่เลือก</text>
  </g>
</svg>
